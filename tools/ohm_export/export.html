<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>OHM Export</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; background: #e9dfc7; }
    .ohm-attribution {
      position: absolute;
      bottom: 8px;
      right: 8px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.84);
      padding: 4px 8px;
      font: 11px/1.3 sans-serif;
      color: #333;
      border-radius: 3px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="ohm-attribution">© OpenHistoricalMap contributors</div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@openhistoricalmap/maplibre-gl-dates@1.3.0/dist/index.js"></script>
  <script>
    const BOUNDS = [[93.0, 18.0], [124.0, 42.5]];
    // 当前 MVP 以战国-秦汉地理结构为主，底图过滤到公元 100 年附近。
    const FILTER_DATE = '0100-01-01';

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://www.openhistoricalmap.org/map-styles/main/main.json',
      bounds: BOUNDS,
      fitBoundsOptions: { padding: 0 },
      attributionControl: false,
      preserveDrawingBuffer: true,
      interactive: false
    });

    map.once('styledata', () => {
      if (typeof map.filterByDate === 'function') {
        map.filterByDate(FILTER_DATE);
      } else if (window.OHM && typeof window.OHM.filterByDate === 'function') {
        window.OHM.filterByDate(map, FILTER_DATE);
      }
    });

    map.on('idle', () => {
      const b = map.getBounds();
      window.__OHM_EXPORT__ = {
        ready: true,
        bbox: {
          minLng: b.getWest(),
          minLat: b.getSouth(),
          maxLng: b.getEast(),
          maxLat: b.getNorth()
        },
        filterDate: FILTER_DATE,
        width: map.getCanvas().width,
        height: map.getCanvas().height
      };
    });
  </script>
</body>
</html>
